<!--
  PROTOTYPE, throwaway. Answers "What the ops review UI looks like"
  (grilled/hp-1-order-intake/issues/02-review-ui-prototype.md) and is the living example of
  DESIGN.md (version 2: friendly, phone-first) at the repository root. Variant A is the chosen
  design; B and C are the alternatives it was chosen over, kept in the same design system.
  Switch with ?variant=A|B|C, the arrows in the bottom bar, or the left/right keys.
  Resize the window (or use a phone) to see the phone, tablet and desk arrangements.
  The agent's output is hand-written over real data-pack rows; no model, no database.
  Everything lives in memory until you reload.
-->
<style>
/* ---------- tokens: DESIGN.md front matter ---------- */
:root{
  color-scheme: light dark;
  --canvas:#f6f3ee;--surface:#ffffff;--sunken:#f0ece5;--hairline:#e6e0d6;--control-border:#8d8578;
  --ink:#22201c;--ink-muted:#5e584f;--ink-faint:#8d8578;
  --accent:#0b6c73;--accent-hover:#085a60;--accent-soft:#dff1f0;--on-accent:#ffffff;
  --sun:#f6b14f;--sun-soft:#fdf0d9;
  --ok:#1d7543;--ok-soft:#e3f4e9;--warn:#8a5300;--warn-soft:#fff0d4;--bad:#b0251d;--bad-soft:#fde8e5;
  --av0:#dff1f0;--av1:#fdf0d9;--av2:#e1edf8;--av3:#efe7da;--av4:#f9e3e6;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-pill:9999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --card:0 1px 2px rgb(34 32 28 / .05);
  --pop:0 2px 4px rgb(34 32 28 / .06),0 12px 32px rgb(34 32 28 / .14);
  --fast:140ms;--base:200ms;--ease:cubic-bezier(.2,.8,.2,1);
  --header:56px;--bar:64px;--btn:40px;
}
@media (prefers-color-scheme: dark){:root{
  --canvas:#141517;--surface:#1d1f22;--sunken:#18191c;--hairline:#2e3035;--control-border:#7d786f;
  --ink:#efede8;--ink-muted:#ada89f;--ink-faint:#7d786f;
  --accent:#63c2c9;--accent-hover:#82d0d6;--accent-soft:#173a3d;--on-accent:#082628;
  --sun:#f4b45e;--sun-soft:#3a2d14;
  --ok:#74d19a;--ok-soft:#183322;--warn:#eab15a;--warn-soft:#382b13;--bad:#f58b80;--bad-soft:#3d1d1a;
  --av0:#173a3d;--av1:#3a2d14;--av2:#1b2d40;--av3:#332b20;--av4:#3d2228;
  --card:0 1px 2px rgb(0 0 0 / .3);--pop:0 2px 4px rgb(0 0 0 / .3),0 12px 32px rgb(0 0 0 / .5);
}}
@media (pointer:coarse){:root{--btn:48px}}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 15px/1.5 var(--sans);background:var(--canvas);color:var(--ink);padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:767px){body{font-size:16px}}
h1,h2,h3,p{margin:0}
.num,td.n{font-variant-numeric:tabular-nums}
.id{font:500 13px/1.3 var(--mono)}
.meta{font:500 13px/1.4 var(--sans);color:var(--ink-muted)}
.label{font:600 14px/1.35 var(--sans);color:var(--ink-muted);margin:var(--s5) 0 var(--s2)}
.greeting{font:700 22px/1.25 var(--sans);letter-spacing:-.3px}
.title{font:700 20px/1.3 var(--sans);letter-spacing:-.2px}
.headline{font:700 18px/1.35 var(--sans);letter-spacing:-.1px}
.reading{font:400 16px/1.6 var(--sans)}
.nowrap{white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:8px;top:8px;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.skip:focus{width:auto;height:auto;clip-path:none;background:var(--surface);padding:8px 12px;z-index:30}
kbd{font:500 12px/1 var(--mono);padding:2px 6px;border:1px solid var(--hairline);border-bottom-width:2px;border-radius:var(--r-sm);color:var(--ink-muted);background:var(--surface)}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (pointer:coarse){.desk-only{display:none!important}}

/* ---------- controls ---------- */
.btn{font:600 14px/1 var(--sans);min-height:var(--btn);padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--control-border);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
.btn:hover{border-color:var(--ink-muted)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn--primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn--primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
.btn--danger{color:var(--bad)}
.btn--ghost{border-color:transparent;background:transparent;color:var(--accent);padding:0 var(--s2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn--sm{min-height:32px;padding:0 var(--s3)}
input,textarea{font:400 15px/1.45 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--control-border);border-radius:var(--r-md);padding:9px 12px}
@media (max-width:767px){input,textarea{font-size:16px}}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
textarea{width:100%;min-height:160px;resize:vertical;font:400 16px/1.6 var(--sans)}
input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- pills, tags, avatars ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 10px;font:600 13px/1.3 var(--sans);white-space:nowrap}
.pill i{font-style:normal}
.s-released,.s-approved{background:var(--ok-soft);color:var(--ok)}
.s-review{background:var(--warn-soft);color:var(--warn)}
.s-rejected{background:var(--bad-soft);color:var(--bad)}
.s-held,.s-no_action{background:var(--sunken);color:var(--ink-muted)}
.tag{display:inline-block;border-radius:var(--r-pill);padding:2px 9px;font:500 13px/1.4 var(--sans);background:var(--sunken);color:var(--ink-muted);white-space:nowrap}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--sans);color:var(--ink)}

/* ---------- header ---------- */
header.top{height:var(--header);display:flex;align-items:center;gap:var(--s5);padding:0 var(--s4);background:var(--surface);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:6}
.wordmark{font:700 16px/1 var(--sans);white-space:nowrap}.wordmark span{color:var(--ink-muted);font-weight:500}
.proto{font:500 12px/1 var(--mono);color:var(--warn);background:var(--warn-soft);padding:4px 7px;border-radius:var(--r-sm)}
nav.tabs{display:flex;gap:var(--s1);height:100%}
nav.tabs a{display:flex;align-items:center;padding:0 var(--s3);color:var(--ink-muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
header .right{margin-left:auto;display:flex;gap:var(--s3);align-items:center}
@media (max-width:767px){header.top{gap:var(--s3)}.proto,.hide-phone,.wordmark span{display:none}nav.tabs a{padding:0 var(--s2)}}

/* ---------- shared blocks ---------- */
.cardbox{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--card)}
.email{background:var(--sunken);border-radius:var(--r-lg);padding:var(--s4) var(--s5);white-space:pre-wrap;margin:var(--s3) 0 0;overflow-wrap:anywhere}
mark.flagged{background:var(--warn-soft);color:inherit;outline:2px dashed var(--warn);outline-offset:2px;border-radius:4px}
.flag-note{color:var(--warn);font-size:14px;margin-top:var(--s2)}
.thinks{background:var(--accent-soft);border-radius:var(--r-lg);padding:var(--s4) var(--s5)}
.thinks .who{font:600 14px var(--sans);color:var(--accent);margin-bottom:4px}
ol.steps{margin:var(--s2) 0 0;padding-left:22px;font-size:14px;color:var(--ink-muted)}
ol.steps li{margin:4px 0}ol.steps .tool{font:500 13px var(--mono);color:var(--accent)}
details>summary{cursor:pointer;color:var(--accent);font:600 14px var(--sans);padding:var(--s2) 0;list-style-position:inside}
table.lines{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden}
table.lines th{font:600 13px var(--sans);color:var(--ink-muted);text-align:left;padding:8px 10px;background:var(--sunken)}
table.lines td{padding:10px;border-top:1px solid var(--hairline);vertical-align:top}
table.lines th.n,table.lines td.n{text-align:right}
table.lines .id{white-space:nowrap}
.order-cap{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:var(--s4) 0 var(--s2)}
.order-cap b{font-weight:700}
.sub{color:var(--warn);font-size:13px;margin-top:2px}
@media (max-width:767px){
  table.lines,table.lines tbody{display:block;border:0}
  table.lines thead{display:none}
  table.lines tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px;padding:12px 14px;border:1px solid var(--hairline);border-radius:var(--r-md);margin-bottom:8px;background:var(--surface)}
  table.lines td{border:0;padding:0}
  table.lines td:first-child{grid-column:1/-1}
  table.lines td.n{text-align:left}
  table.lines td.n::before{content:attr(data-label);display:block;font:500 13px var(--sans);color:var(--ink-muted)}
}
ul.checks{list-style:none;margin:0;padding:0}
ul.checks li{display:grid;grid-template-columns:24px 1fr;gap:2px 8px;padding:var(--s3) 0;border-top:1px solid var(--hairline)}
ul.checks li:first-child{border-top:0}
ul.checks .ic{font-weight:700;text-align:center;line-height:1.5}
ul.checks .name{font-weight:600}
ul.checks .why{display:block;color:var(--ink-muted);font-size:14px}
.ok .ic{color:var(--ok)}.soft .ic{color:var(--warn)}.hard .ic{color:var(--bad)}
.lock{font-size:14px;color:var(--bad);margin-top:4px}
.ovr{margin-top:8px;display:flex}.ovr input{flex:1;min-width:0}
.waiting{border-radius:var(--r-lg);padding:var(--s1) var(--s4);background:var(--warn-soft)}
.waiting.hard{background:var(--bad-soft)}
.err{color:var(--bad);font-size:14px;margin-top:var(--s2)}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s5)}
.inline-reason{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s5);padding:var(--s4);border-radius:var(--r-lg);background:var(--sunken)}
.inline-reason label{width:100%;font:600 14px var(--sans)}
.inline-reason input{flex:1;min-width:200px}
.custcard{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s4)}
.custcard dt{color:var(--ink-muted);font-size:14px}.custcard dd{margin:0;min-width:0}
.custcard .explain{display:block;color:var(--ink-muted);font-size:13px}
.audit-wrap{overflow-x:auto}
table.audit{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden}
table.audit th{text-align:left;font:600 13px var(--sans);color:var(--ink-muted);padding:10px 14px;background:var(--sunken)}
table.audit td{padding:10px 14px;border-top:1px solid var(--hairline);vertical-align:top}
.who-agent{color:var(--accent);font-weight:600}.who-gate{color:var(--ink-muted);font-weight:600}.who-person{color:var(--ink);font-weight:700}
@media (max-width:767px){
  table.audit,table.audit tbody{display:block;border:0;background:transparent}
  table.audit thead{display:none}
  table.audit tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
  table.audit td{border:0;padding:0}
  table.audit td:last-child{grid-column:1/-1}
}
.page{max-width:1100px;margin:0 auto;padding:var(--s5) var(--s4)}
#toast{position:fixed;right:var(--s4);bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom));z-index:20;max-width:440px}
.toast{background:var(--ink);color:var(--canvas);box-shadow:var(--pop);border-radius:var(--r-lg);padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;animation:rise var(--base) var(--ease)}
.toast .btn{background:transparent;color:var(--canvas);border-color:currentColor}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:767px){#toast{left:var(--s3);right:var(--s3);max-width:none;bottom:calc(var(--bar) + 84px + env(safe-area-inset-bottom))}}

/* ---------- Variant A: the chosen desk ---------- */
.a-grid{display:grid;grid-template-columns:340px minmax(0,1fr) 460px;gap:12px;padding:12px;height:calc(100dvh - var(--header) - var(--bar) - env(safe-area-inset-bottom))}
.a-list,.a-mid,.a-right{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--card);overflow:auto;min-width:0}
.a-mid{padding:var(--s5) var(--s6) var(--s6)}
.a-mid .inner{max-width:720px}
.a-right{padding:var(--s5) var(--s5) var(--s6)}
.hello{padding:var(--s5) var(--s4) var(--s4);border-bottom:1px solid var(--hairline)}
.hello p{margin-top:4px;color:var(--ink-muted)}
.progress{height:8px;border-radius:var(--r-pill);background:var(--sun-soft);margin-top:var(--s3);overflow:hidden}
.progress span{display:block;height:100%;background:var(--sun);border-radius:inherit;transition:width var(--base) var(--ease)}
.tip{margin:var(--s3) var(--s4) 0;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--accent-soft);font-size:14px;display:flex;gap:var(--s3);align-items:flex-start}
.tip p{flex:1}
.a-filters{display:flex;flex-wrap:wrap;gap:6px;padding:var(--s3) var(--s4);position:sticky;top:0;background:var(--surface);z-index:1}
.a-filters button{font:600 14px var(--sans);border:1px solid var(--hairline);background:var(--surface);color:var(--ink-muted);padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;min-height:36px}
.a-filters button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.a-filters .count{margin-left:6px;opacity:.75}
ul.rows{list-style:none;margin:0;padding:0 var(--s2) var(--s3)}
.a-row{display:flex;gap:var(--s3);width:100%;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:var(--s3);cursor:pointer;border-radius:var(--r-md);border-left:3px solid transparent;min-height:64px;transition:background-color var(--fast) var(--ease)}
.a-row:hover{background:var(--canvas)}
.a-row[aria-current=true]{background:var(--accent-soft);border-left-color:var(--accent)}
.a-row .body{flex:1;min-width:0}
.a-row .top{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}
.a-row .from{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-row .subj{margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .bottom{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.allclear{margin:var(--s3) var(--s4);padding:var(--s4);border-radius:var(--r-md);background:var(--sun-soft)}
.a-hint{padding:var(--s3) var(--s4) var(--s4);color:var(--ink-muted);font-size:13px}
.back{display:none}
.actionbar{position:static}
/* tablet: two panes, the detail scrolls with the page */
@media (max-width:1199px){
  .a-grid{grid-template-columns:300px minmax(0,1fr);height:auto;align-items:start}
  .a-list{grid-row:1 / span 2;position:sticky;top:calc(var(--header) + 12px);max-height:calc(100dvh - var(--header) - var(--bar) - 24px)}
  .a-mid,.a-right{grid-column:2;overflow:visible}
  .a-mid{padding:var(--s5)}
}
/* phone: list, then detail */
@media (max-width:767px){
  .a-grid{display:block;padding:0;gap:0}
  .a-list,.a-mid,.a-right{border-radius:0;border-left:0;border-right:0;box-shadow:none;position:static;max-height:none;overflow:visible}
  .a-grid[data-mview=list] .a-mid,.a-grid[data-mview=list] .a-right{display:none}
  .a-grid[data-mview=detail] .a-list{display:none}
  .a-grid[data-mview=detail]{display:flex;flex-direction:column}
  .a-right{order:1;padding:var(--s4)}
  .a-mid{order:2;padding:var(--s4);border-top:0}
  .back{display:flex;order:0;width:100%;padding:var(--s3) var(--s4) 0;background:var(--surface)}
  .btn kbd{display:none}
  .actionbar{position:sticky;bottom:calc(var(--bar) + env(safe-area-inset-bottom));z-index:3;background:var(--surface);margin:var(--s5) calc(-1 * var(--s4)) 0;padding:var(--s3) var(--s4);border-top:1px solid var(--hairline);box-shadow:0 -6px 16px rgb(34 32 28 / .06)}
  .actionbar .btn{flex:1}
}

/* ---------- Variant B: one decision at a time ---------- */
.b-wrap{max-width:860px;margin:0 auto;padding:var(--s5) var(--s4)}
.b-progress{display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s4);flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--card);padding:var(--s5)}
.b-done-row{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--hairline);font-size:14px;flex-wrap:wrap}

/* ---------- Variant C: ledger table ---------- */
.c-wrap{padding:var(--s4)}
.c-bar{display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s3);flex-wrap:wrap}
.c-bar input{width:280px;max-width:100%}
.c-scroll{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--hairline)}
table.ledger{width:100%;border-collapse:collapse;background:var(--surface);min-width:980px}
table.ledger th{background:var(--sunken);text-align:left;font:600 13px var(--sans);color:var(--ink-muted);padding:10px;white-space:nowrap}
table.ledger td{padding:10px;border-top:1px solid var(--hairline);vertical-align:top}
table.ledger tr.main{cursor:pointer}table.ledger tr.main:hover{background:var(--canvas)}
table.ledger tr.open{background:var(--accent-soft)}
td.ck{text-align:center;font-weight:700}.ck.y{color:var(--ok)}.ck.w{color:var(--warn)}.ck.x{color:var(--bad)}.ck.na{color:var(--ink-faint)}
tr.detail td{background:var(--canvas);padding:var(--s4)}
.c-detail{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:var(--s5)}
.c-drawer{position:fixed;top:var(--header);right:0;bottom:var(--bar);width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--hairline);box-shadow:var(--pop);overflow:auto;padding:var(--s4);z-index:4;overscroll-behavior:contain}

/* ---------- prototype switcher (not part of the design) ---------- */
#switcher{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;display:flex;align-items:center;gap:6px;padding:5px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:25;font:13px system-ui,sans-serif}
#switcher button{background:#333;color:#fff;border:0;border-radius:999px;width:32px;height:32px;cursor:pointer}
#switcher .lbl{padding:0 10px;font-weight:600;white-space:nowrap}#switcher .st{color:#aaa;padding-right:6px;white-space:nowrap}
@media (max-width:767px){#switcher .st{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="switcher" aria-label="Prototype variant switcher"></div>
<script>
// ---------------------------------------------------------------- data (real data-pack rows)
const CUST = {

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = id => ITEMS.find(i => i.id===id);

function avatar(name){
  const ini = name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
  const n = [...name].reduce((s,c) => s + c.charCodeAt(0), 0) % 5;
  return `<span class="av" style="background:var(--av${n})" aria-hidden="true">${esc(ini)}</span>`;
}
const plural = (n, one, many) => `${n} ${n===1?one:many}`;

function checks(it){
  if (!it.orders.length) return [];
  const c = CUST[it.cust], t = total(it), out = [];
  out.push({k:'contact', label:'Known sender', hard:false, ok:it.contact.known, note:`${it.contact.name}, ${it.contact.role}, is on file for this customer.`});
  const subs = lines(it).filter(l => l.subFor);
  out.push({k:'active', label:'Everything can be sold', hard:true, ok:true, note: subs.length ? 'Once the swap below is accepted.' : 'No discontinued products.'});
  if (subs.length) out.push({k:'sub', label:'Product swap', hard:false, ok:false,
    note: subs.map(l => `${l.subFor.sku} is discontinued, so the agent picked its replacement ${l.sku}. The price goes from ${$(l.subFor.price)} to ${$(l.price)} a case.`).join(' ')});
  out.push({k:'price', label:'Our own prices', hard:false, ok:true, note:'Contract or list price for Mon 2 Nov 2026.'});
  const need = {}; lines(it).forEach(l => need[l.sku] = (need[l.sku]||0) + l.qty);
  const short = Object.entries(need).filter(([s,q]) => q > lines(it).find(l=>l.sku===s).avail);
  out.push({k:'stock', label:'In stock', hard:false, ok:!short.length,
    note: short.length ? short.map(([s,q]) => `${s}: ${q} wanted, only ${lines(it).find(l=>l.sku===s).avail} on the shelf.`).join(' ') : 'Every line is covered.'});
  out.push({k:'hold', label:'Not on credit hold', hard:true, ok:c.status!=='CREDIT_HOLD', note: c.status==='CREDIT_HOLD' ? 'Accounts has paused this customer (CREDIT_HOLD).' : 'The account is active.'});
  const after = c.balance + t;
  out.push({k:'limit', label:'Within credit limit', hard:true, ok:after<=c.limit, note: after<=c.limit ? `${$(after)} of ${$(c.limit)} after this order.` : `This order would take them to ${$(after)}, over their ${$(c.limit)} limit.`});
  out.push({k:'shipto', label:'Clear delivery address', hard:false, ok:true, note: it.orders.length>1 ? `${it.orders.length} addresses, each named in the email.` : 'Named in the email, or their usual one.'});
  it.flags.forEach(f => out.push({k:'flag-'+f.id, label:POLICY[f.policy]||`Policy ${f.policy}`, hard:false, ok:false, note:f.text}));
  return out;
}
const failing = it => checks(it).filter(c => !c.ok);
const hardBlocked = it => failing(it).some(c => c.hard);
ITEMS.forEach(it => {
  log('agent','run',it.id,`${it.kind}; ${it.trace.length} tool calls`,`Mon 2 Nov ${it.at}`);
  if (it.status==='released') log('gate','clean',it.id,`all checks pass; released ${it.so.join(', ')}`,`Mon 2 Nov ${it.at}`);
  else if (it.status==='no_action') log('agent','close',it.id,'no action: marketing spam',`Mon 2 Nov ${it.at}`);
  else log('gate','review',it.id,'failing: '+failing(it).map(c=>c.label).join(', '),`Mon 2 Nov ${it.at}`);
});

// ---------------------------------------------------------------- actions
const queue = () => ITEMS.filter(i => i.status==='review');
function nextReview(id){ const q = queue(); return (q.find(x => x.id > id) || q[0] || {}).id || null; }
function approve(id){
  const it = byId(id), f = failing(it);
  if (it.status!=='review' || f.some(c => c.hard)) return;
  const missing = f.filter(c => !(it.ovr[c.k]||'').trim());
  if (missing.length){ it.err = `Add a quick note about why it’s OK: ${missing.map(c=>c.label.toLowerCase()).join(', ')}.`; render(); focusFirst(`[data-ovr^="${id}|"]`); return; }
  it.err = null;
  f.forEach(c => log('person','override',id,`${c.label}: “${it.ovr[c.k].trim()}”`));
  log('gate','re-check',id,`hard rules pass; ${f.length} soft check(s) overridden`);
  it.so = it.orders.map(() => 'SO-' + (nextSO++)); it.status = 'approved';
  log('person','approve',id,`released ${it.so.join(', ')}, ${$(total(it))}`);
  const left = queue().length;
  showToast(`Released ${it.so.join(', ')} for ${CUST[it.cust].name}. ${left ? `${left} to go.` : 'That’s everything 🎉'}`, id);
  moveOn(id); render();
}
function undo(id){
  const it = byId(id); if (it.status!=='approved') return;
  log('person','undo',id,`withdrew ${it.so.join(', ')} within the undo window`);
  it.status = 'review'; it.so = null; S.sel = id; S.mview = 'detail'; S.toast = null; render();
}
function askReason(id, kind){ byId(id).pending = kind; if (variant==='C') S.cOpen[id] = true; render(); focusFirst(`[data-reason="${id}"]`); }
function confirmReason(id){
  const it = byId(id), input = document.querySelector(`[data-reason="${id}"]`), reason = (input?.value||'').trim();
  if (!reason){ it.err = 'Add a short note so the team knows why.'; render(); focusFirst(`[data-reason="${id}"]`); return; }
  const kind = it.pending;
  it.status = kind==='reject' ? 'rejected' : 'held'; it.reason = reason; it.err = null;
  log('person', kind, id, reason); it.pending = null;
  const left = queue().length;
  showToast(`${kind==='reject'?'Rejected':'Put on hold'}: ${it.id}. ${left ? `${left} to go.` : 'That’s everything 🎉'}`);
  moveOn(id); render();
}
function editQty(id, oi, li, val){
  const it = byId(id), l = it.orders[oi].lines[li], v = Math.max(0, Math.floor(Number(val)||0));
  if (v === l.qty) return;
  log('person','edit',id,`${l.sku} quantity ${l.qty} → ${v}`); l.qty = v;
  const f = failing(it).map(c=>c.label); log('gate','re-check',id, f.length ? 'failing: '+f.join(', ') : 'all checks pass');
  render();
}
function approveReply(id){ byId(id).replyStatus = 'approved'; log('person','reply ready',id,'would send (never emailed)'); render(); }
function moveOn(id){ const n = nextReview(id); if (variant==='A'){ if (n) S.sel = n; else S.mview = 'list'; } if (variant==='B') S.bFocus = n; }
function showToast(msg, id){ S.toast = {msg, id}; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 10000); }
function focusFirst(sel){ requestAnimationFrame(() => document.querySelector(sel)?.focus()); }
function dismissTip(){ S.tip = false; try { localStorage.setItem('hp-tip-dismissed','1'); } catch (e) {} }

  <span class="right"><span class="meta hide-phone">Mon 2 Nov 2026</span>${avatar('Ops Reviewer')}<span class="meta hide-phone">ops.reviewer</span></span></header>`;
}
function emailBody(it, folded){
  let b = esc(it.body);
  if (it.flagPassage) b = b.replace(esc(it.flagPassage), `<mark class="flagged">${esc(it.flagPassage)}</mark>`);
  const inner = `<pre class="email reading">${b}</pre>${it.flagPassage?`<p class="flag-note"><b>Heads up:</b> the marked part is talking to our system, not to us. The agent didn’t follow it.</p>`:''}`;
  return folded ? `<details><summary>Read the email</summary>${inner}</details>` : inner;
}
function linesTable(it, editable){
  return it.orders.map((o,oi) => `
    <div class="order-cap"><b>${it.orders.length>1?`Delivery ${oi+1} of ${it.orders.length}`:'Delivery'}</b>
      <span class="meta">${esc(o.shipTo)}</span><span class="meta">· ${o.requested==='no date given'?'no date asked for':'wanted '+esc(o.requested)}</span>
      <span class="num">· ${$(oTotal(o))}</span>${it.so&&it.so[oi]?` ${idf(it.so[oi])}`:''}</div>
    <table class="lines"><thead><tr><th scope="col">Product</th><th scope="col" class="n">Qty</th><th scope="col" class="n">Price</th><th scope="col" class="n">Total</th></tr></thead><tbody>
    ${o.lines.map((l,li) => `<tr><td>${idf(l.sku)} ${esc(l.name)}
        ${l.subFor?`<div class="sub">Swapped in for ${esc(l.subFor.sku)} ${esc(l.subFor.name)}, which is discontinued</div>`:''}
        <div class="meta">They wrote: “${esc(l.asked)}”</div></td>
      <td class="n nowrap" data-label="Quantity">${editable?`<input type="number" min="0" inputmode="numeric" aria-label="Quantity of ${esc(l.sku)}" value="${l.qty}" data-qty="${it.id}|${oi}|${li}">`:l.qty}&nbsp;${l.uom==='CS'?'cases':l.uom}<div class="meta">${l.avail} on the shelf</div></td>
      <td class="n nowrap" data-label="Price">${$(l.price)}<div class="meta">${l.src} price</div></td><td class="n nowrap" data-label="Total">${$(l.qty*l.price)}</td></tr>`).join('')}
    </tbody></table>`).join('');
}
function checkRow(it, c, overridable){
  const cls = c.ok ? 'ok' : c.hard ? 'hard' : 'soft', ic = c.ok ? '✓' : c.hard ? '🔒' : '!';
  let extra = '';
  if (!c.ok && c.hard) extra = `<div class="lock">Can’t be overridden. Accounts needs to clear this first.</div>`;
  else if (!c.ok && overridable && it.status==='review') extra = `<div class="ovr"><input aria-label="Why ${esc(c.label.toLowerCase())} is OK" placeholder="Add a quick note about why it’s OK…" data-ovr="${it.id}|${c.k}" value="${esc(it.ovr[c.k]||'')}"></div>`;
  else if (!c.ok && it.ovr[c.k]) extra = `<div class="meta">Your note: “${esc(it.ovr[c.k])}”</div>`;
  return `<li class="${cls}"><span class="ic" aria-hidden="true">${ic}</span><div><span class="name">${c.label}</span><span class="why">${esc(c.note)}</span>${extra}</div></li>`;
}
function checksList(it, overridable, which){
  const cs = checks(it).filter(c => which==='fail' ? !c.ok : which==='pass' ? c.ok : true);
  return cs.length ? `<ul class="checks">${cs.map(c => checkRow(it, c, overridable)).join('')}</ul>` : '';
}
function actionButtons(it){
  if (it.status !== 'review'){
    const r = it.reason ? ` <span class="meta">“${esc(it.reason)}”</span>` : '';
    return `<div class="actions">${pill(it.status)}${it.so?` ${it.so.map(idf).join(', ')}`:''}${r}</div>`;
  }
  if (it.pending) return `<div class="inline-reason actionbar"><label for="r-${it.id}">${it.pending==='reject'?'Why are we rejecting this?':'Why are we holding this?'}</label>
    <input id="r-${it.id}" data-reason="${it.id}" placeholder="${it.pending==='reject'?'e.g. The customer cancelled by phone…':'e.g. Waiting for accounts to call back…'}">
    <button class="btn ${it.pending==='reject'?'btn--danger':'btn--primary'}" data-act="confirm" data-id="${it.id}">${it.pending==='reject'?'Reject':'Put on hold'}</button>
    <button class="btn" data-act="cancel" data-id="${it.id}">Cancel</button>${it.err?`<div class="err" role="alert">${esc(it.err)}</div>`:''}</div>`;
  const hb = hardBlocked(it), soft = failing(it).filter(c=>!c.hard).length;
  return `${it.err?`<div class="err" role="alert">${esc(it.err)}</div>`:''}<div class="actions actionbar">
    ${hb?`<button class="btn btn--primary" data-act="hold" data-id="${it.id}">Put on hold… <kbd class="desk-only">h</kbd></button>`
       :`<button class="btn btn--primary" data-act="approve" data-id="${it.id}">Approve & release <kbd class="desk-only">a</kbd></button>`}
    <button class="btn btn--danger" data-act="reject" data-id="${it.id}">Reject… <kbd class="desk-only">r</kbd></button></div>
    ${soft && !hb ? `<p class="meta" style="margin-top:8px">Approving keeps your ${plural(soft,'note','notes')} in the audit log.</p>` : ''}`;
}
function replyBox(it){
  if (!it.reply) return '<p class="meta">No reply needed for this one.</p>';
  const done = it.replyStatus === 'approved';
  return `<textarea aria-label="Reply to ${esc(it.fromName)}" data-reply="${it.id}" ${done?'disabled':''}>${esc(it.reply)}</textarea>
    <p class="meta" style="margin-top:6px">We never send email from here; this is what would go out.</p>
    <div class="actions" style="margin-top:12px">${done?'<span class="pill s-approved"><i aria-hidden="true">✓</i>Reply ready</span> <span class="meta">by ops.reviewer</span>':`<button class="btn" data-act="reply" data-id="${it.id}">Mark reply ready</button>`}</div>`;
}
const traceList = it => `<details><summary>See how the agent worked it out (${it.trace.length} steps)</summary><ol class="steps">${it.trace.map(([t,a,r]) => `<li><span class="tool" translate="no">${t}</span>(${esc(a)}) → ${esc(r)}</li>`).join('')}</ol></details>`;
const thinks = it => `<div class="thinks reading"><div class="who">What the agent thinks</div>${esc(it.why)}</div>`;
function custCard(it){
  if (!it.cust) return '<p class="meta">We couldn’t match this sender to a customer.</p>';
  const c = CUST[it.cust];
  return `<dl class="custcard"><dt>Customer</dt><dd>${esc(c.name)} ${idf(c.id)}</dd>
    <dt>Account</dt><dd>${c.status==='CREDIT_HOLD'?'<span class="pill s-rejected"><i aria-hidden="true">🔒</i>On credit hold</span><span class="explain">Accounts has paused this customer.</span>':'Active'}</dd>
    <dt>Credit</dt><dd class="num">${$(c.balance)} owed of ${$(c.limit)} · pays ${c.terms.replace('NET','in ')} days</dd>
    <dt>Sender</dt><dd>${it.contact.known?esc(it.contact.name+', '+it.contact.role):'Not on file yet'}</dd></dl>`;
}
function headline(it){
  const c = it.cust && CUST[it.cust], n = it.orders.length;
  if (!n) return 'Nothing to do here';
  if (it.status==='released') return `The agent released ${it.so.join(', ')} for ${esc(c.name)}, ${$(total(it))}`;
  if (it.status==='approved') return `You released ${it.so.join(', ')} for ${esc(c.name)}, ${$(total(it))}`;
  if (it.status==='rejected') return `You rejected the order from ${esc(c.name)}`;
  if (it.status==='held') return `The order from ${esc(c.name)} is on hold`;
  if (hardBlocked(it)) return `${esc(c.name)} can’t get this order yet (${$(total(it))})`;
  return `Release ${n===1?'an order':plural(n,'order','orders')} for ${esc(c.name)}, ${$(total(it))}?`;
}
function auditTable(){
  return `<div class="audit-wrap"><table class="audit"><thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th><th scope="col">Email</th><th scope="col">Detail</th></tr></thead><tbody>
  ${AUDIT.slice().reverse().map(e => `<tr><td class="meta" style="white-space:nowrap">${e.at}</td>
    <td class="who-${e.actor}">${e.actor==='person'?'ops.reviewer':e.actor==='gate'?'release gate':'agent'}</td><td>${e.action}</td><td>${idf(e.id)}</td><td>${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}
const auditPage = () => `<main id="main" class="page"><h1 class="title" style="margin-bottom:6px">Audit log</h1><p class="meta" style="margin-bottom:16px">Everything the agent did and every call a person made, newest first.</p>${auditTable()}</main>`;

// ---------------------------------------------------------------- Variant A: the chosen desk
const FILTERS = {all:'All', review:'Needs you', done:'Done', other:'Other'};
const inFilter = (i, f) => f==='all' || (f==='review' ? i.status==='review' : f==='done' ? ['released','approved'].includes(i.status) : !['review','released','approved'].includes(i.status));
function proposalPanel(it, h='h2'){
  const f = failing(it), hb = f.some(c=>c.hard), open = it.status==='review', passing = checks(it).length - f.length;
  return `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">${pill(it.status)}${idf(it.id)}</div>
    <${h} class="headline" style="margin-top:12px">${headline(it)}</${h}>
    ${it.orders.length ? `
      ${open && f.length ? `<h3 class="label">Why it’s waiting for you</h3><div class="waiting ${hb?'hard':''}">${checksList(it,true,'fail')}</div>` : ''}
      <details ${open?'':'open'}><summary>${open ? `${passing} checks look good` : `All ${checks(it).length} checks`}</summary>${checksList(it,false, open?'pass':'all')}</details>
      ${actionButtons(it)}
      <h3 class="label">Customer</h3>${custCard(it)}
      <h3 class="label">What they ordered</h3>${linesTable(it, open)}
      <h3 class="label">Reply to the customer</h3>${replyBox(it)}` : `<p class="reading" style="margin-top:12px">${esc(it.why)}</p>`}`;
}
function helloCard(){
  const q = queue().length, totalN = ITEMS.length, done = totalN - q;
  return `<div class="hello"><h1 class="greeting">Good morning</h1>
    <p>${q ? `${plural(q,'email needs','emails need')} you. The agent handled the other ${done}.` : 'You’re all caught up.'}</p>
    <div class="progress" role="progressbar" aria-label="Emails handled" aria-valuemin="0" aria-valuemax="${totalN}" aria-valuenow="${done}"><span style="width:${Math.round(done/totalN*100)}%"></span></div>
    <p class="meta" style="margin-top:6px">${done} of ${totalN} handled</p></div>
    ${S.tip ? `<div class="tip"><p><b>How this works:</b> the agent reads every email and drafts the order. Anything risky waits here for you. <b>Green</b> means done, <b>amber</b> means it needs you.</p><button class="btn btn--ghost btn--sm" data-act="tip" aria-label="Dismiss the tip">Got it</button></div>` : ''}`;
}
function VariantA(){
  if (S.view==='audit') return auditPage();
  const show = ITEMS.filter(i => inFilter(i, S.filter));
  const it = byId(S.sel) || ITEMS[0], folded = phone();
  const empty = S.filter==='review' && !show.length;
  return `<div class="a-grid" data-mview="${S.mview}">
   <nav class="a-list" aria-label="Emails">
    ${helloCard()}
    <div class="a-filters" role="tablist" aria-label="Show">${Object.entries(FILTERS).map(([k,v]) => `<button role="tab" aria-selected="${S.filter===k}" data-act="filter" data-f="${k}">${v}<span class="count num">${ITEMS.filter(i=>inFilter(i,k)).length}</span></button>`).join('')}</div>
    ${empty ? `<div class="allclear"><p class="headline">All clear 🎉</p><p style="margin-top:4px">Nothing needs you right now. The agent handled ${ITEMS.filter(i=>['released','no_action'].includes(i.status)).length} on its own and you decided ${ITEMS.filter(i=>['approved','rejected','held'].includes(i.status)).length}.</p><p style="margin-top:8px"><a href="#" data-act="view" data-v="audit">See the audit log</a></p></div>` : ''}
    <ul class="rows">${show.map(i => `<li><button class="a-row" data-act="sel" data-id="${i.id}" aria-current="${!folded && i.id===it.id}">
      ${avatar(i.fromName)}<span class="body">
      <span class="top"><span class="from">${esc(i.fromName)}</span><span class="meta num">${i.at}</span></span>
      <span class="subj" style="display:block">${esc(i.subject)}</span>
      <span class="bottom">${pill(i.status)}<span class="tag">${i.kind}</span></span></span></button></li>`).join('')}</ul>
    <p class="a-hint desk-only hide-phone"><span class="nowrap"><kbd>j</kbd> <kbd>k</kbd> move</span> · <span class="nowrap"><kbd>a</kbd> approve</span> · <span class="nowrap"><kbd>r</kbd> reject</span> · <span class="nowrap"><kbd>h</kbd> hold</span></p>
   </nav>
   <div class="back"><button class="btn btn--ghost" data-act="back">← All emails</button></div>
   <main class="a-mid" id="main"><div class="inner">
    <div style="display:flex;gap:12px;align-items:center">${avatar(it.fromName)}<div style="min-width:0"><h2 class="title">${esc(it.subject)}</h2>
    <p class="meta">${esc(it.fromName)} &lt;${esc(it.from)}&gt; · Mon 2 Nov ${it.at} · <span class="tag">${it.kind}</span></p></div></div>
    ${emailBody(it, folded)}
    <div style="margin-top:20px">${thinks(it)}</div>
    <div style="margin-top:8px">${traceList(it)}</div>
   </div></main>
   <aside class="a-right" aria-label="What to decide">${proposalPanel(it)}</aside></div>`;
}

// ---------------------------------------------------------------- Variant B: one decision at a time
function VariantB(){
  if (S.view==='audit') return auditPage();
  const q = queue();
  if (!S.bFocus || !q.find(x=>x.id===S.bFocus)) S.bFocus = (q[0]||{}).id || null;
  const it = byId(S.bFocus), handled = ITEMS.filter(i => i.status!=='review');
  const main = !it ? `<div class="card"><h1 class="headline">All clear 🎉</h1><p class="meta" style="margin-top:4px">Nothing needs you. See the <a href="#" data-act="view" data-v="audit">audit log</a>.</p></div>`
    : `<div class="card">${proposalPanel(it,'h1')}<div style="margin-top:20px">${thinks(it)}</div>${emailBody(it,true)}${traceList(it)}</div>`;
  return `<main id="main" class="b-wrap">
    <div class="b-progress"><b>${plural(q.length,'email needs','emails need')} you</b><span class="meta">${handled.length} handled</span></div>
    ${main}
    <h2 class="label">Handled (${handled.length})</h2>
    ${handled.map(i => `<div class="b-done-row">${pill(i.status)}${idf(i.id)}<span>${esc(i.subject)}</span><span class="meta">${i.so?i.so.join(', '):''} ${i.reason?'“'+esc(i.reason)+'”':''}</span></div>`).join('')}
  </main>`;
}

// ---------------------------------------------------------------- Variant C: ledger table
function ck(ok, hard, na){ return na ? '<td class="ck na" aria-label="not applicable">·</td>' : ok ? '<td class="ck y" aria-label="looks good">✓</td>' : `<td class="ck ${hard?'x':'w'}" aria-label="${hard?'blocked':'needs you'}">${hard?'🔒':'!'}</td>`; }
function VariantC(){
  const rows = ITEMS.map(it => {
    const cs = checks(it), g = k => cs.find(c=>c.k===k), na = !it.orders.length;
    const credit = na ? null : (g('hold').ok && g('limit').ok);
    const flags = cs.filter(c => !c.ok && (c.k.startsWith('flag') || c.k==='sub')).length;
    const open = S.cOpen[it.id];
    const main = `<tr class="main ${open?'open':''}" data-act="crow" data-id="${it.id}">
      <td>${it.status==='review'?`<input type="checkbox" aria-label="Select ${it.id}" data-csel="${it.id}" ${S.cSel[it.id]?'checked':''}>`:''}</td>
      <td>${idf(it.id)} <span class="meta">${it.at}</span><div>${esc(it.subject)}</div></td>
      <td>${it.cust?esc(CUST[it.cust].name):'<span class="meta">none</span>'}</td>
      <td><span class="tag">${it.kind}</span></td>
      <td class="n num">${na?'':it.orders.length}</td>
      <td class="n num" style="text-align:right">${na?'':$(total(it))}</td>
      ${ck(na||g('contact').ok,false,na)}${ck(na||g('active').ok,true,na)}${ck(na||g('stock').ok,false,na)}${ck(credit,true,na)}
      <td>${flags?`<span class="pill s-review"><i aria-hidden="true">!</i>${flags}</span>`:''}</td>
      <td>${pill(it.status)}</td></tr>`;
    const detail = open ? `<tr class="detail"><td colspan="12"><div class="c-detail">
      <div>${it.orders.length?linesTable(it, it.status==='review'):'<p class="meta">No order.</p>'}<div style="margin-top:12px">${thinks(it)}</div></div>
      <div>${custCard(it)}<h3 class="label">Checks</h3>${checksList(it,true)}${actionButtons(it)}</div>
      <div><h3 class="label" style="margin-top:0">Reply to the customer</h3>${replyBox(it)}${emailBody(it,true)}${traceList(it)}</div>
      </div></td></tr>` : '';
    return main + detail;
  }).join('');
  const nSel = Object.values(S.cSel).filter(Boolean).length;
  return `<main id="main" class="c-wrap">
    <div class="c-bar"><b>${plural(queue().length,'needs','need')} you</b><span class="meta">Tap a row to open it. The shared note applies to every soft check of the selected rows.</span>
      <span style="margin-left:auto"></span>
      <input type="text" aria-label="Note for the selected rows" placeholder="One note for the selected rows…" data-bulk value="${esc(S.cBulkReason)}">
      <button class="btn btn--primary" data-act="bulk" ${nSel?'':'disabled'}>Approve ${nSel||''} selected</button>
      <button class="btn" data-act="caudit">${S.cAudit?'Close':'Open'} audit log</button></div>
    <div class="c-scroll"><table class="ledger"><thead><tr><th></th><th>Email</th><th>Customer</th><th>Kind</th><th>Orders</th><th style="text-align:right">Value</th><th>Sender</th><th>Products</th><th>Stock</th><th>Credit</th><th>Flags</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${S.cAudit||S.view==='audit'?`<aside class="c-drawer" aria-label="Audit log"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 class="title">Audit log</h2><button class="btn" data-act="caudit">Close</button></div>${auditTable()}</aside>`:''}
  </main>`;
}
function bulkApprove(){
  const ids = Object.keys(S.cSel).filter(k => S.cSel[k]); const skipped = [];
  ids.forEach(id => { const it = byId(id); if (it.status!=='review') return;
    if (hardBlocked(it)) { skipped.push(id); return; }
    failing(it).forEach(c => { if (!(it.ovr[c.k]||'').trim()) it.ovr[c.k] = S.cBulkReason; });
    approve(id); });
  S.cSel = {}; if (skipped.length) showToast(`Couldn’t approve ${skipped.join(', ')}: a hard rule blocks it.`);
  render();
}

// ---------------------------------------------------------------- switcher + render
const params = new URLSearchParams(location.search);
let variant = (params.get('variant')||'A').toUpperCase(); if (!VARIANTS.find(v=>v[0]===variant)) variant='A';
if (params.get('email') && byId(params.get('email'))){ S.sel = params.get('email'); S.mview = params.get('view')==='list' ? 'list' : 'detail'; }
function syncUrl(){ const p = new URLSearchParams(location.search); p.set('variant', variant); if (variant==='A'){ p.set('email', S.sel); p.set('view', S.mview); } else { p.delete('email'); p.delete('view'); } history.replaceState(null,'','?'+p.toString()); }
function setVariant(v){ variant = v; render(); }
function cycle(d){ const i = VARIANTS.findIndex(v=>v[0]===variant); setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0]); }
function renderToast(){
  document.getElementById('toast').innerHTML = S.toast ? `<div class="toast"><span>${esc(S.toast.msg)}</span>${S.toast.id?`<button class="btn btn--sm" data-act="undo" data-id="${S.toast.id}">Undo</button>`:''}</div>` : '';
}
function render(){
  const body = variant==='A' ? VariantA() : variant==='B' ? VariantB() : VariantC();
  document.getElementById('app').innerHTML = header() + body;
  renderToast(); syncUrl();
  const name = VARIANTS.find(v=>v[0]===variant)[1];
  const cnt = s => ITEMS.filter(i=>s.includes(i.status)).length;
  document.getElementById('switcher').innerHTML = `<button data-sw="-1" aria-label="Previous variant">←</button>
    <span class="lbl">${variant} · ${name}</span><span class="st">${cnt(['review'])} need you · ${AUDIT.length} audit events</span>
    <button data-sw="1" aria-label="Next variant">→</button>`;
}
matchMedia('(max-width: 767px)').addEventListener('change', render);
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]'); if (sw) return cycle(Number(sw.dataset.sw));
  if (e.target.matches('input,textarea')) { if (e.target.dataset.csel){ S.cSel[e.target.dataset.csel] = e.target.checked; render(); } return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.act;
  if (b.tagName==='A') e.preventDefault();
  if (['approve','reject','hold','confirm','cancel','undo','reply'].includes(a)) e.stopPropagation();
  if (a==='view'){ S.view = b.dataset.v; if (variant==='C') S.cAudit = S.view==='audit'; }
  else if (a==='filter') S.filter = b.dataset.f;
  else if (a==='sel'){ S.sel = id; S.mview = 'detail'; if (phone()) window.scrollTo(0,0); }
  else if (a==='back') S.mview = 'list';
  else if (a==='tip') dismissTip();
  else if (a==='approve') return approve(id);
  else if (a==='reject') return askReason(id,'reject');
  else if (a==='hold') return askReason(id,'hold');
  else if (a==='confirm') return confirmReason(id);
  else if (a==='cancel'){ byId(id).pending = null; byId(id).err = null; }
  else if (a==='undo') return undo(id);
  else if (a==='reply') return approveReply(id);
  else if (a==='crow') S.cOpen[id] = !S.cOpen[id];
  else if (a==='bulk') return bulkApprove();
  else if (a==='caudit'){ S.cAudit = !S.cAudit; if (!S.cAudit) S.view='inbox'; }
  render();
});
document.addEventListener('change', e => { const q = e.target.dataset.qty; if (q){ const [id,oi,li] = q.split('|'); editQty(id, +oi, +li, e.target.value); } });
document.addEventListener('input', e => {
  const o = e.target.dataset.ovr; if (o){ const [id,k] = o.split('|'); byId(id).ovr[k] = e.target.value; }
  const r = e.target.dataset.reply; if (r) byId(r).reply = e.target.value;
  if (e.target.hasAttribute('data-bulk')) S.cBulkReason = e.target.value;
});
document.addEventListener('keydown', e => {
  const r = e.target.dataset && e.target.dataset.reason;
  if (r && e.key==='Enter'){ e.preventDefault(); return confirmReason(r); }
  if (r && e.key==='Escape'){ byId(r).pending = null; byId(r).err = null; return render(); }
  if (e.target.closest('input,textarea,select,[contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='ArrowLeft') return cycle(-1);
  if (e.key==='ArrowRight') return cycle(1);
  const cur = variant==='A' ? S.sel : variant==='B' ? S.bFocus : null;
  if (e.key==='j' || e.key==='k'){
    const list = variant==='A' ? ITEMS.filter(i => inFilter(i, S.filter)) : queue();
    const i = list.findIndex(x=>x.id===cur), n = list[(i+(e.key==='j'?1:-1)+list.length)%list.length];
    if (n){ if (variant==='A') S.sel = n.id; else S.bFocus = n.id; render(); }
    return;
  }
  if (!cur) return;
  const it = byId(cur); if (it.status!=='review') return;
  if (e.key==='a' && !hardBlocked(it)) approve(cur);
  else if (e.key==='r') askReason(cur,'reject');
  else if (e.key==='h' && hardBlocked(it)) askReason(cur,'hold');
});
render();
</script>
</body>
</html>
